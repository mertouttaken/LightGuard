# ============================================================== #
#                                                                #
#                🛡️ LIGHTGUARD SECURITY V3.0 🛡️                #
#            Advanced Anti-Crash & Exploit Protection            #
#                 [1.21.4 Paperweight Native]                    #
#                                                                #
# ============================================================== #

settings:
  prefix: "&8[&cLightGuard&8] &7"

  kick-layout:
    - "&4&m-----------------------------------------"
    - "&c&lLIGHTGUARD SECURITY"
    - ""
    - "&fUser: &7%player%"
    - "&fDetection: &c%check%"
    - "&fPing: &e%ping%ms"
    - ""
    - "&4&l⛔ ACTION BLOCKED ⛔"
    - "&7You have violated server security."
    - "&4&m-----------------------------------------"

  sentinel:
    enabled: true
    safe-mode-threshold: 10
    silent-failures: false
    geyser-support: true

    critical-checks:
      - "ItemExploitCheck"
      - "PayloadCheck"
      - "PacketSizeCheck"
      - "WindowCheck"

  radar:
    burst-threshold: 12
    window-ms: 4000

# ============================================================== #
#                     PACKET & EXPLOIT CHECKS                    #
# ============================================================== #
checks:
  anvil:
    enabled: true

  recipe:
    enabled: true

  keep-alive:
    enabled: true

  raw-packet:
    enabled: true
    max-raw-size: 40960
    pre-login-max-size: 131072

  packet-size:
    enabled: true
    max-string-length: 256
    per-packet-limit: 32000
    excluded-packets:
      - "ServerboundEditBookPacket"
      - "ServerboundCustomPayloadPacket"

  window:
    enabled: true
    strict-slots: true
    prevent-lectern-spam: true
    prevent-swap-in-gui: true

  sign:
    enabled: true
    max-line-length: 45
    block-json-syntax: true

  client-settings:
    enabled: true
    max-length: 128

  eof-exploit:
    enabled: true

  vehicle:
    enabled: true
    check-steer: true
    prevent-invalid-move: true

  map-exploit:
    enabled: true
    max-pps: 3

  chat-unicode:
    enabled: true
    block-zalgo: true

  bad-packets:
    enabled: true
    check-negative-values: true
    prevent-self-interact: true

  client-brand:
    enabled: true
    max-length: 128
    block-invalid-chars: true

  resource-pack:
    enabled: true

  entity:
    enabled: true
    prevent-invalid-entity: true
    prevent-armorstand-spam: true

  flood:
    max-threshold: 500.0
    decay-per-second: 150.0
    max-violations: 3

  block-place:
    enabled: true
    max-pps: 12
    check-coordinates: true
    printer-check: true
    printer-threshold: 6
    prevent-illegal-blocks: true
    illegal-blocks:
      - "minecraft:command_block"
      - "minecraft:repeating_command_block"
      - "minecraft:chain_command_block"
      - "minecraft:structure_void"
      - "minecraft:structure_block"
      - "minecraft:jigsaw"
      - "minecraft:end_portal_frame"
      - "minecraft:light"

  item-exploit:
    enabled: true
    max-string-len: 100
    max-lore-size: 10
    max-depth: 7
    max-attributes: 7
    max-attribute-value: 100.0
    max-enchant-level: 20
    illegal-keys:
      - "run_command"
      - "clickEvent"
      - "hoverEvent"
      - "Score"
      - "Selector"
      - "translation.test.invalid"

  position:
    enabled: true
    max-offset: 25.0
    elytra-max-distance: 50.0
    max-vertical-distance: 50.0
    out-of-world-limit: 29999984.0

  book:
    enabled: true
    max-pages: 5
    max-bytes-per-page: 150
    strip-ascii: true

  payload:
    enabled: true
    max-size: 1024
    blocked-channels:
      - "minecraft:bedit"
      - "minecraft:bsign"
      - "minecraft:bopen"
      - "wdl:init"
      - "world_downloader"

  command:
    enabled: true
    block-syntax: true
    blacklist:
      - "/calc"
      - "//calc"
      - "/eval"
      - "//eval"
      - "/solve"
      - "//solve"
      - "/hd readtext"
      - "/pex"
      - "/op"
      - "/deop"
      - "/stop"
      - "/minecraft:me"
      - "/bukkit:me"
      - "/me"
      - "/execute"
      - "/function"
      - "/reload"
      - "/rl"

  tab:
    enabled: true
    max-length: 256
    block-chars:
      - "["
      - "]"
      - "{"
      - "}"
      - "\\"
      - ":"
      - ";"
      - "@"
      - "="
      - "\""
      - "'"
      - "`"
      - "$"
    block-contains:
      - "targetoffset"
      - "for("
      - "selector"
      - "run_command"
      - "^(."
      - "*."
      - "execute"
      - "summon"
      - "nbt"
      - "tag"
      - "uuid"
      - "score"
      - "jndi"
      - "ldap"
      - "rmi"

# ============================================================== #
#                       PACKET LOGGER                            #
# ============================================================== #
packet-logger:
  enabled: false
  heavy-packet-threshold: 5000000
  output: FILE
  player-mode: WHITELIST
  players: []
  packet-mode: BLACKLIST
  packets:
    - "ServerboundKeepAlivePacket"
    - "ServerboundMovePlayerPacket"
    - "ServerboundMovePlayerPacket$Pos"
    - "ServerboundMovePlayerPacket$Rot"
    - "ServerboundMovePlayerPacket$PosRot"
    - "ServerboundMovePlayerPacket$StatusOnly"

# ============================================================== #
#                     GAMEPLAY MECHANICS                         #
# ============================================================== #
mechanics:
  prevent-mule-dupe: true
  bed-duplication: true
  prevent-invalid-trade: true
  prevent-anvil-dupe: true
  prevent-furnace-dupe: true
  prevent-hopper-dupe: true
  prevent-bed-crop-dupe: true

  max-arrow-velocity: 12.0
  prevent-portal-break: true
  null-chunk: true
  self-damage: true
  limit-falling-blocks: true
  max-falling-blocks-per-chunk: 10
  prevent-nether-roof: true
  prevent-piston-crash: true
  prevent-end-teleport-exploits: true

  nether-portal-delay: true
  shears-cooldown: true
  break-close-inventory: true
  interact-container-delay: 300
  block-dead-packets: true
  close-inventory-on-teleport: true
  trapdoor-rail-redstone: true
  prevent-dispenser-spam: true
  disable-piglin-trading: false