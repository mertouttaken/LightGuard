# ============================================================== #
#                                                                #
#                🛡️ LIGHTGUARD SECURITY V2 🛡️                 #
#            Advanced Anti-Crash & Exploit Protection            #
#                                                                #
# ============================================================== #

settings:
  # The prefix used in LightGuard's console and in-game messages.
  prefix: "&8[&cLightGuard&8] &7"

  # The layout used when a player is kicked for a security violation.
  # Available placeholders: %player%, %check%, %ping%
  kick-layout:
    - "&4&m-----------------------------------------"
    - "&c&lLIGHTGUARD SECURITY"
    - ""
    - "&fUser: &7%player%"
    - "&fDetection: &c%check%"
    - "&fPing: &e%ping%ms"
    - ""
    - "&4&l⛔ ACTION BLOCKED ⛔"
    - "&7You have violated server security."
    - "&4&m-----------------------------------------"

  # The Sentinel system monitors LightGuard's internal health.
  # If a check throws too many errors, it disables it automatically to prevent TPS loss.
  sentinel:
    enabled: true
    safe-mode-threshold: 10
    silent-failures: false # If true, errors are hidden from the console.
    geyser-support: true # Relaxes certain movement/packet checks for Bedrock players.

    # Checks listed here are considered "Critical".
    # Sentinel will NEVER disable these checks, even if they throw errors.
    critical-checks:
      - "NBTExploit"
      - "ItemExploit"
      - "Payload"
      - "Flood"
      - "PacketSize"

  # Central Radar
  radar:
    burst-threshold: 12
    window-ms: 4000

# ============================================================== #
#                     PACKET & EXPLOIT CHECKS                    #
# ============================================================== #
checks:
  anvil:
    enabled: true

  recipe:
    enabled: true

  keep-alive:
    enabled: true

  raw-packet:
    enabled: true
    max-raw-size: 40960
    pre-login-max-size: 131072

  packet-size:
    enabled: true
    max-string-length: 256
    max-buffer-size: 16384
    per-packet-limit: 32000
    excluded-packets:
      - "PacketPlayInBEdit"
      - "PacketPlayInCustomPayload"

  window:
    enabled: true
    strict-slots: true
    prevent-lectern-spam: true
    prevent-swap-in-gui: true

  sign:
    enabled: true
    max-line-length: 45
    block-json-syntax: true

  client-settings:
    enabled: true
    max-length: 128

  eof-exploit:
    enabled: true

  vehicle:
    enabled: true
    check-steer: true
    prevent-invalid-move: true

  map-exploit:
    enabled: true
    max-pps: 3

  chat-unicode:
    enabled: true
    block-zalgo: true

  bad-packets:
    enabled: true
    check-negative-values: true
    prevent-self-interact: true

  client-brand:
    enabled: true
    max-length: 128
    block-invalid-chars: true

  resource-pack:
    enabled: true

  entity:
    enabled: true
    prevent-invalid-entity: true
    prevent-armorstand-spam: true

  # Hybrid Rate Limiter
  flood:
    max-threshold: 500.0
    decay-per-second: 150.0
    max-violations: 3

  block-place:
    enabled: true
    max-pps: 12
    check-coordinates: true
    printer-check: true
    printer-threshold: 6
    prevent-illegal-blocks: true
    illegal-blocks:
      - "COMMAND_BLOCK"
      - "REPEATING_COMMAND_BLOCK"
      - "CHAIN_COMMAND_BLOCK"
      - "STRUCTURE_VOID"
      - "STRUCTURE_BLOCK"
      - "JIGSAW"
      - "END_PORTAL_FRAME"
      - "LIGHT"

  item-exploit:
    enabled: true
    max-nbt-size: 2048
    max-string-len: 100
    max-lore-size: 10
    max-list-size: 100
    max-array-size: 256
    max-total-nodes: 1000
    max-depth: 7
    max-attributes: 7
    max-attribute-value: 100
    max-enchant-level: 20
    illegal-keys:
      - "run_command"
      - "clickEvent"
      - "hoverEvent"
      - "Score"
      - "Selector"
      - "translation.test.invalid"
    nbt-occurrences:
      - "extra:15"
      - "{:50"
      - "translate:5"
      - "score:5"

  position:
    enabled: true
    max-offset: 25.0
    elytra-max-distance: 50.0
    max-vertical-distance: 50.0
    out-of-world-limit: 29999984.0

  book:
    enabled: true
    max-pages: 5
    max-bytes-per-page: 150
    strip-ascii: true

  payload:
    enabled: true
    max-size: 1024
    blocked-channels:
      - "MC|BEdit"
      - "MC|BSign"
      - "MC|BOpen"
      - "PacketPlayInUpdateSign"
      - "WDL|INIT"
      - "PERMISSIONS_REPL"
      - "MC|TrList"
      - "minecraft:bedit"
      - "minecraft:bsign"
      - "minecraft:bopen"
      - "wdl:init"
      - "world_downloader"

  command:
    enabled: true
    block-syntax: true
    blacklist:
      - "/calc"
      - "//calc"
      - "/eval"
      - "//eval"
      - "/solve"
      - "//solve"
      - "/hd readtext"
      - "/pex"
      - "/op"
      - "/deop"
      - "/stop"
      - "/minecraft:me"
      - "/bukkit:me"
      - "/me"
      - "/execute"
      - "/function"
      - "/reload"
      - "/rl"

  tab:
    enabled: true
    max-length: 256
    block-chars:
      - "["
      - "]"
      - "{"
      - "}"
      - "\\"
      - ":"
      - ";"
      - "@"
      - "="
      - "\""
      - "'"
      - "`"
      - "$"
    block-contains:
      - "targetoffset"
      - "for("
      - "selector"
      - "run_command"
      - "^(."
      - "*."
      - "execute"
      - "summon"
      - "nbt"
      - "tag"
      - "uuid"
      - "score"
      - "jndi"
      - "ldap"
      - "rmi"

# ============================================================== #
#                       PACKET LOGGER                            #
# ============================================================== #
packet-logger:
  enabled: false
  heavy-packet-threshold: 5000000
  output: FILE
  player-mode: WHITELIST
  players: []
  packet-mode: BLACKLIST
  packets:
    - "PacketPlayInKeepAlive"
    - "PacketPlayInFlying"
    - "PacketPlayInPosition"
    - "PacketPlayInLook"
    - "PacketPlayInPositionLook"

# ============================================================== #
#                     GAMEPLAY MECHANICS                         #
# ============================================================== #
mechanics:

  # --- Dupe & Economy Protections ---
  prevent-mule-dupe: true
  bed-duplication: true
  prevent-invalid-trade: true
  prevent-anvil-dupe: true
  prevent-furnace-dupe: true
  prevent-hopper-dupe: true
  prevent-bed-crop-dupe: true

  # --- Exploit & Crash Protections ---
  max-arrow-velocity: 12.0
  prevent-portal-break: true
  null-chunk: true
  self-damage: true
  limit-falling-blocks: true
  max-falling-blocks-per-chunk: 10
  prevent-nether-roof: true
  prevent-piston-crash: true
  prevent-end-teleport-exploits: true

  # --- Lag & Spam Mitigations ---
  nether-portal-delay: true
  shears-cooldown: true
  break-close-inventory: true
  interact-container-delay: 300
  block-dead-packets: true
  close-inventory-on-teleport: true
  trapdoor-rail-redstone: true
  prevent-dispenser-spam: true
  disable-piglin-trading: false