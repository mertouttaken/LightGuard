# ============================================================== #
#                                                                #
#                   LIGHTGUARD SECURITY V3.0                     #
#            Advanced Anti-Crash & Exploit Protection            #
#                    [Paper 1.21.4 Native]                       #
#                                                                #
#  Every "enabled" flag below is honoured: a disabled check is    #
#  never registered, so it costs nothing per packet. Toggles      #
#  apply on /lg reload.                                           #
#                                                                #
# ============================================================== #

settings:
  kick-layout:
    - "&4&m-----------------------------------------"
    - "&c&lLIGHTGUARD SECURITY"
    - ""
    - "&fUser: &7%player%"
    - "&fDetection: &c%check%"
    - "&fPing: &e%ping%ms"
    - ""
    - "&4&l! ACTION BLOCKED !"
    - "&7You have violated server security."
    - "&4&m-----------------------------------------"

  sentinel:
    enabled: true
    safe-mode-threshold: 10
    silent-failures: false
    geyser-support: true

    # Checks that are never auto-disabled, and that block the packet if they throw.
    critical-checks:
      - "ItemExploitCheck"
      - "PayloadCheck"
      - "PacketSizeCheck"
      - "WindowCheck"

  # Kicks a player after this many blocked packets inside the window.
  radar:
    burst-threshold: 12
    window-ms: 4000

# ============================================================== #
#                     PACKET & EXPLOIT CHECKS                    #
# ============================================================== #
checks:
  # --- Run on every packet ---
  packet-size:
    enabled: true
    max-string-length: 256
    excluded-packets:
      - "ServerboundEditBookPacket"
      - "ServerboundCustomPayloadPacket"

  # Command blocks, structure blocks, jigsaws and command minecarts.
  protocol-exploit:
    enabled: true

  # --- Per-packet checks ---
  anvil:
    enabled: true

  recipe:
    enabled: true

  keep-alive:
    enabled: true

  abilities:
    enabled: true

  client-action:
    enabled: true

  held-item:
    enabled: true

  no-com:
    enabled: true

  creative:
    enabled: true
    max-stack-size: 64
    max-lore-total-len: 3000

  raw-packet:
    # Raw byte ceiling for a connection before it finishes logging in.
    pre-login-max-size: 131072

  window:
    enabled: true

  sign:
    enabled: true
    max-line-length: 45
    block-json-syntax: true

  client-settings:
    enabled: true
    max-length: 128

  vehicle:
    enabled: true

  map-exploit:
    enabled: true
    max-pps: 3

  chat-unicode:
    enabled: true
    block-zalgo: true

  bad-packets:
    enabled: true
    prevent-self-interact: true

  entity:
    enabled: true
    prevent-armorstand-spam: true
    # Vanilla has no click-rate cap; this only catches packet-level automation.
    # 10ms is 100 attacks/second, far above what a human reaches by drag-clicking.
    min-attack-interval-ms: 10

  # Weight-based flood limiter applied to every inbound packet.
  flood:
    max-threshold: 500.0
    decay-per-second: 150.0
    max-violations: 3

  block-place:
    enabled: true
    max-pps: 12
    check-coordinates: true
    illegal-blocks:
      - "minecraft:command_block"
      - "minecraft:repeating_command_block"
      - "minecraft:chain_command_block"
      - "minecraft:structure_void"
      - "minecraft:structure_block"
      - "minecraft:jigsaw"
      - "minecraft:end_portal_frame"
      - "minecraft:light"

  item-exploit:
    enabled: true
    max-string-len: 100
    max-lore-size: 10
    max-attributes: 7
    max-attribute-value: 100.0
    max-enchant-level: 20
    illegal-keys:
      - "run_command"
      - "clickEvent"
      - "hoverEvent"
      - "Score"
      - "Selector"

  position:
    enabled: true
    max-offset: 25.0
    elytra-max-distance: 50.0
    max-vertical-distance: 50.0
    out-of-world-limit: 29999984.0

  book:
    enabled: true
    # Vanilla ceilings. Lowering these will reject books players can legitimately write.
    max-chars-per-page: 1024
    max-pages: 100
    max-page-bytes: 8192
    max-edits-per-sec: 5

  payload:
    enabled: true
    # Payload byte size is enforced by the vanilla codec before this plugin sees the packet;
    # only the channel is screened here.
    blocked-channels:
      - "wdl:init"
      - "wdl:control"
      - "world_downloader"

  command:
    enabled: true
    block-syntax: true
    max-commands-per-sec: 20
    blacklist:
      - "/calc"
      - "//calc"
      - "/eval"
      - "//eval"
      - "/solve"
      - "//solve"
      - "/hd readtext"
      - "/pex"
      - "/op"
      - "/deop"
      - "/stop"
      - "/reload"
      - "/rl"

  tab:
    enabled: true
    max-length: 256
    # Substrings that abort a tab-completion request. Kept narrow on purpose: entries like
    # "nbt", "tag" or "execute" match ordinary vanilla commands and will kick real players.
    block-contains:
      - "targetoffset"
      - "translation.test"

# ============================================================== #
#                       PACKET LOGGER                            #
# ============================================================== #
packet-logger:
  enabled: false
  # Nanoseconds. Only packets slower than this are logged; -1 logs everything.
  heavy-packet-threshold: 500000
  output: FILE
  player-mode: WHITELIST
  players: []
  packet-mode: BLACKLIST
  packets:
    - "ServerboundKeepAlivePacket"
    - "ServerboundMovePlayerPacket"
    - "ServerboundMovePlayerPacket$Pos"
    - "ServerboundMovePlayerPacket$Rot"
    - "ServerboundMovePlayerPacket$PosRot"
    - "ServerboundMovePlayerPacket$StatusOnly"

# ============================================================== #
#                     GAMEPLAY MECHANICS                         #
# ============================================================== #
mechanics:
  prevent-mule-dupe: true
  bed-duplication: true
  prevent-invalid-trade: true
  prevent-anvil-dupe: true
  prevent-furnace-dupe: true
  prevent-hopper-dupe: true
  prevent-bed-crop-dupe: true

  max-arrow-velocity: 12.0
  prevent-portal-break: true
  null-chunk: true
  self-damage: true
  limit-falling-blocks: true
  max-falling-blocks-per-chunk: 10
  prevent-nether-roof: true
  prevent-piston-crash: true
  prevent-end-teleport-exploits: true

  nether-portal-delay: true
  shears-cooldown: true
  break-close-inventory: true
  interact-container-delay: 300
  close-inventory-on-teleport: true
  # Randomly drops ~20% of redstone pulses on trapdoors, rails, comparators and observers.
  # Effective against clock-based lag machines, but it will also break legitimate contraptions.
  trapdoor-rail-redstone: true
  prevent-dispenser-spam: true
  disable-piglin-trading: false
